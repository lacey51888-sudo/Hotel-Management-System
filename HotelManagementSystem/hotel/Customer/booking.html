<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking</title>

    <link rel="stylesheet" href="../global.css">


    <style>
        body {
            font-family: var(--font-main);
            background: var(--bg-main);
            margin: 0;
            padding: 0;
        }

        .top-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            padding: var(--spacing-lg);
            border-radius: 10px;
            box-shadow: var(--shadow-sm);
            margin-bottom: var(--spacing-xl);
        }

        .search-box input {
            padding: var(--spacing-sm) var(--spacing-md);
            width: 260px;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 15px;
        }

        .sort-btn {
            padding: var(--spacing-sm) var(--spacing-md);
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .sort-dropdown {
            position: absolute;
            top: 48px;
            right: 0;
            background: var(--bg-card);
            border-radius: 8px;
            box-shadow: var(--shadow-md);
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .sort-dropdown button {
            padding: var(--spacing-md);
            border: none;
            background: white;
            text-align: left;
            font-size: 14px;
            cursor: pointer;
        }

        .sort-dropdown button:hover {
            background: var(--bg-main);
        }

        /* ——— room-card ——— */
        .room-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
            gap: var(--spacing-lg);
        }

        .room-card {
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-md);
            transition: 0.25s;
            padding: var(--spacing-lg);
        }

        .room-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .room-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: var(--spacing-md);
        }

        .room-price {
            margin-top: var(--spacing-sm);
            color: var(--primary);
            font-size: 18px;
            font-weight: 700;
        }

        .order-btn {
            padding: var(--spacing-sm) var(--spacing-md);
            background: var(--primary);
            color: white;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .order-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
    </style>
</head>

<body>

<div class="app-container">

    <!-- left server -->
    <nav class="sidebar">
        <div class="sidebar-header">🏨 Hotel Management System</div>

        <ul class="nav-menu">

            <li class="nav-item">
                <span class="nav-icon">🏠</span>
                <a href="home.html" class="nav-link">Home</a>
            </li>

            <li class="nav-item">
                <span class="nav-icon">💼</span>
                <a href="booking.html" class="nav-link">Booking</a>
            </li>

            <li class="nav-item">
                <span class="nav-icon">📦</span>
                <a href="comment.html" class="nav-link">Comment</a>
            </li>

            <li class="nav-item">
                <span class="nav-icon">📦</span>
                <a href="order.html" class="nav-link">Order</a>
            </li>

            <li class="nav-item">
                <span class="nav-icon">🛎️</span>
                <a href="service.html" class="nav-link">Service</a>
            </li>

            <li class="nav-item">
                <span class="nav-icon">🔑</span>
                <a href="../Staff/Login_Register.html" class="nav-link" id="login-link">Login</a>
            </li>

            <li class="nav-item">
                <span class="nav-icon">👤</span>
                <a href="personal.html" class="nav-link" id="personal-link">Personal Center</a>
            </li>

            <li class="nav-item">
                <span class="nav-icon">🚪</span>
                <a href="../Staff/Login_Register.html" class="nav-link" id="logout-link">Logout</a>
            </li>

        </ul>
    </nav>

 
    <main class="main-content">


        <div class="content-header">
            <h1>Hotel Room Booking</h1>
            <p style="color: var(--text-secondary); margin-top: 8px;">
                Please choose a room type and place your booking
            </p>
        </div>

        <div class="top-controls">
            <div class="search-box">
                <input id="searchInput" type="text" placeholder="Search room type...">
            </div>

            <div class="sort-menu" style="position:relative;">
                <button class="sort-btn" id="sortBtn">Sort ▾</button>

                <div class="sort-dropdown" id="sortDropdown">
                    <button class="sort-item" data-sort="score">Score</button>
                    <button class="sort-item" data-sort="price">Price</button>
                </div>
            </div>
            <div style="display:flex; gap:12px; align-items:center;">
                <label>Capacity
                    <select id="capacityFilter">
                        <option value="all">All</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                    </select>
                </label>
                <label>Check-in <input type="date" id="checkinDate"></label>
                <label>Check-out <input type="date" id="checkoutDate"></label>
            </div>
        </div>


        <div class="room-grid" id="roomGrid"></div>

    </main>
</div>

<script>
    // Shared inventory and orders
    const INVENTORY_KEY = 'hm_inventory';
    const ORDERS_KEY = 'hm_orders';
    async function fetchJSON(url, options){
        try {
            const r = await fetch(url, options);
            const text = await r.text();
            try { return JSON.parse(text); } catch(e) { console.error('bad_json', url, text); return { ok:false, error:'bad_json' }; }
        } catch(e) {
            console.error('network_error', url, e);
            return { ok:false, error:'network_error' };
        }
    }
    let typeMap = { Single:'Single', Double:'Double', Quad:'Quad' };
    async function initInventory(){
        const types = await fetchJSON('http://localhost/api/room_types_get.php');
        const inv = await fetchJSON('http://localhost/api/inventory_get.php');
        if (types && types.ok) {
            typeMap = {};
            types.data.forEach(t=>{ typeMap[t.type_name]=t.type_id; });
        }
        if (!(inv && inv.ok)) {
            const localInv = JSON.parse(localStorage.getItem(INVENTORY_KEY)||'null');
            if (!localInv) localStorage.setItem(INVENTORY_KEY, JSON.stringify({ Single: 8, Double: 12, Quad: 5 }));
        } else {
            localStorage.setItem(INVENTORY_KEY, JSON.stringify(inv.data));
        }
    }
    async function renderRoomCards(){
        const grid = document.getElementById('roomGrid');
        
        const typesResp = await fetchJSON('http://localhost/api/room_types_get.php');
        const invResp = await fetchJSON('http://localhost/api/inventory_get.php');
        
        console.log('Room Types Response:', typesResp);
        console.log('Inventory Response:', invResp);
        
        const invMap = (invResp && invResp.ok) ? invResp.data : {};
        const types = (typesResp && typesResp.ok) ? typesResp.data : [];
        
        if (!typesResp || !typesResp.ok) {
            grid.innerHTML = '<p style="text-align:center;color:red;padding:40px;">Failed to load room types. Please check if the database is set up correctly.<br>Error: ' + (typesResp?.error || 'Network error') + '</p>';
            return;
        }
        
        if (types.length === 0) {
            grid.innerHTML = '<p style="text-align:center;color:var(--text-secondary);padding:40px;">No room types available. Please run hotel_mgmt.sql to create sample data.</p>';
            return;
        }
        
        typeMap = {};
        types.forEach(t=>{ typeMap[t.type_name]=t.type_id; });
        
        grid.innerHTML = '';
        
        types.forEach(t=>{
            const price = t.amount || 0;
            const available = invMap[t.type_name] ?? 0;
            const score = t.score || 0;
            
            console.log(`Room Type: ${t.type_name}, Available: ${available}`);
            
            const card = document.createElement('div');
            card.className = 'room-card';
            card.dataset.typeId = t.type_id;
            card.dataset.typeName = t.type_name;
            card.dataset.capacity = t.capacity||2;
            card.dataset.price = price;
            card.dataset.score = score;
            card.innerHTML = `
                <div class="room-header">
                    <span>${t.type_name} • Capacity ${t.capacity||2}</span>
                    <button class="order-btn">Order</button>
                </div>
                <div>Available: <strong>${available}</strong></div>
                <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:var(--spacing-sm);">
                    <div class="room-price">¥${price}/night</div>
                    <div style="font-size:14px;color:var(--text-secondary);">⭐ ${score.toFixed(1)}</div>
                </div>
            `;
            card.querySelector('.order-btn').addEventListener('click', (e)=>{
                e.preventDefault();
                placeOrder(card, t);
            });
            grid.appendChild(card);
        });
    }
    renderRoomCards();

    async function placeOrder(card, roomType){
        const user = JSON.parse(localStorage.getItem('hm_user')||'null');
        // Check if logged in
        if (!user || !user.user_id) {
            alert('Please login first');
            window.location.href = '../Staff/Login_Register.html';
            return;
        }
        // Check if staff (staff cannot book)
        if (user.staff_or_not === 'Yes' || user.user_type === 'staff' || user.user_type === 'cleaner' || user.user_type === 'manager' || user.role_id !== 'customer') {
            alert('Staff cannot make bookings. Please login as a customer.');
            return;
        }
        
        const typeId = card.dataset.typeId;
        const typeName = card.dataset.typeName;
        const maxCapacity = parseInt(card.dataset.capacity, 10) || 2;
        const price = parseFloat(card.dataset.price) || 0;
        
        // Ask for actual number of guests
        const actualCapacityInput = prompt(`Please enter the number of guests (Max: ${maxCapacity}):`);
        if (actualCapacityInput === null) return; // User cancelled
        
        const actualCapacity = parseInt(actualCapacityInput, 10);
        if (isNaN(actualCapacity) || actualCapacity < 1) {
            alert('Invalid number of guests! Must be at least 1.');
            return;
        }
        if (actualCapacity > maxCapacity) {
            alert(`Number of guests (${actualCapacity}) exceeds room capacity (${maxCapacity})!`);
            return;
        }
        
        // Check dates first
        const ci = document.getElementById('checkinDate').value;
        const co = document.getElementById('checkoutDate').value;
        
        // Date validation
        if (!ci || !co) {
            alert('Please select check-in and check-out dates');
            return;
        }
        
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const checkInDate = new Date(ci);
        const checkOutDate = new Date(co);
        
        if (checkInDate < today) {
            alert('Check-in date cannot be in the past');
            return;
        }
        
        if (checkOutDate <= checkInDate) {
            alert('Check-out date must be after check-in date');
            return;
        }
        
        // Check inventory (after date validation)
        const invResp = await fetchJSON('http://localhost/api/inventory_get.php');
        console.log('Checking inventory:', invResp);
        
        if (invResp && invResp.ok) {
            const available = invResp.data[typeName] || 0;
            console.log(`Room type: ${typeName}, Available: ${available}`);
            
            if (available <= 0) {
                alert('Sorry, ' + typeName + ' is sold out for selected dates.\n\nPlease try:\n1. Different dates\n2. Another room type\n3. Contact staff for assistance');
                return;
            }
        } else {
            console.error('Failed to check inventory:', invResp);
            alert('Warning: Cannot verify room availability. Please contact staff.');
        }
        
        // Calculate total amount
        const days = Math.ceil((checkOutDate - checkInDate) / (1000 * 60 * 60 * 24));
        const totalAmount = price * days;
        
        if (!confirm(`Confirm booking?\n\nRoom Type: ${typeName}\nCheck-in: ${ci}\nCheck-out: ${co}\nDays: ${days}\nTotal: ¥${totalAmount}`)) {
            return;
        }
        
        const resp = await fetchJSON('http://localhost/api/order_create.php', {
            method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({
                user_id: user.user_id, 
                room_id:'', 
                type_id: typeId, 
                actual_capacity: actualCapacity,
                check_in: ci, 
                check_out: co, 
                staff_id:'', 
                total_amount: totalAmount
            })
        });
        
        if (resp && resp.ok) {
            alert('Booking successful! Order ID: ' + resp.order_id);
            location.href = 'order.html';
        } else {
            alert('Booking failed: ' + (resp?.error || 'Server error'));
        }
    }

    // buttons bound in renderRoomCards
</script>


<script>
    const sortBtn = document.getElementById("sortBtn");
    const sortDropdown = document.getElementById("sortDropdown");

    sortBtn.addEventListener("click", function(e){
        e.stopPropagation();
        sortDropdown.style.display =
            sortDropdown.style.display === "flex" ? "none" : "flex";
    });

    document.addEventListener("click", function(){
        sortDropdown.style.display = "none";
    });
    
    // Sort functionality
    document.querySelectorAll('.sort-item').forEach(btn => {
        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const sortType = this.dataset.sort;
            const grid = document.getElementById('roomGrid');
            const cards = Array.from(grid.querySelectorAll('.room-card'));
            
            cards.sort((a, b) => {
                if (sortType === 'score') {
                    return parseFloat(b.dataset.score) - parseFloat(a.dataset.score);
                } else if (sortType === 'price') {
                    return parseFloat(a.dataset.price) - parseFloat(b.dataset.price);
                }
                return 0;
            });
            
            // Rearrange cards
            cards.forEach(card => grid.appendChild(card));
            
            // Close dropdown menu
            sortDropdown.style.display = "none";
        });
    });

if (localStorage.getItem("loggedIn") === null) {
    localStorage.setItem("loggedIn", "true");
}


function updateNav() {
    const loggedIn = localStorage.getItem("loggedIn") === "true";
    const loginLink = document.getElementById("login-link");

    if (loginLink) loginLink.style.display = loggedIn ? "none" : "block";
}


    updateNav();


const logoutLink = document.getElementById("logout-link");
if (logoutLink) {
    logoutLink.addEventListener("click", function(e) {
        e.preventDefault(); // stop jumping
        localStorage.setItem("loggedIn", "false");
        alert("Logout successful!");
        window.location.href = '../Staff/Login_Register.html';
        updateNav();
    });
}

    document.querySelectorAll('.nav-item').forEach(item => {
        const link = item.querySelector('a');
        if (link && link.href === window.location.href) {
            item.classList.add('active');
        } else {
            item.classList.remove('active');
        }
    });

    // Filters
    document.getElementById('capacityFilter').addEventListener('change', function(){
        const val = this.value;
        document.querySelectorAll('.room-card').forEach(card=>{
            const c = card.dataset.capacity;
            card.style.display = (val==='all' || String(c)===val) ? '' : 'none';
        });
    });
    document.getElementById('searchInput').addEventListener('input', function(){
        const kw = this.value.toLowerCase();
        document.querySelectorAll('.room-card').forEach(card=>{
            card.style.display = card.textContent.toLowerCase().includes(kw) ? '' : 'none';
        });
    });

</script>

</body>
