<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Center - Hotel System</title>
<link rel="stylesheet" href="../global.css">

<style>
body {
    font-family: var(--font-main);
    background: var(--bg-main);
    margin: 0;
    padding: 0;
}
.app-container {
    display: flex;
    height: 100vh;
    overflow: hidden;
}
.main-content {
    flex: 1;
    overflow-y: auto;
    padding: var(--spacing-lg);
}
.content-header {
    background: var(--bg-card);
    padding: var(--spacing-lg);
    border-radius: 10px;
    box-shadow: var(--shadow-sm);
    margin-bottom: var(--spacing-xl);
}
h1 { margin:0; }
.personal-container {
    max-width: 480px;
    margin: 40px auto;
    background: var(--bg-card);
    padding: 32px;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
}
.input-group {
    margin-bottom: 20px;
    display: flex;
    flex-direction: column;
}
.input-group label {
    font-size: 14px;
    margin-bottom: 6px;
}
.input-group input {
    padding: 10px 12px;
    font-size: 15px;
    border-radius: var(--radius-md);
    border: 1px solid #ccc;
}
.save-btn {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: 0.2s;
}
.save-btn:hover { opacity:0.9; }
</style>
</head>

<body>
<div class="app-container">

<!-- 左导航 -->
    <nav class="sidebar">
        <div class="sidebar-header">🏨 Hotel Management System</div>

        <ul class="nav-menu">

            <li class="nav-item">
                <span class="nav-icon">🏠</span>
                <a href="home.html" class="nav-link">Home</a>
            </li>

            <li class="nav-item">
                <span class="nav-icon">💼</span>
                <a href="booking.html" class="nav-link">Booking</a>
            </li>

            <li class="nav-item">
                <span class="nav-icon">📦</span>
                <a href="comment.html" class="nav-link">Comment</a>
            </li>

            <li class="nav-item">
                <span class="nav-icon">📦</span>
                <a href="order.html" class="nav-link">Order</a>
            </li>

            <li class="nav-item">
                <span class="nav-icon">🛎️</span>
                <a href="service.html" class="nav-link">Service</a>
            </li>

            <li class="nav-item">
                <span class="nav-icon">🔑</span>
                <a href="../Staff/Login_Register.html" class="nav-link" id="login-link">Login</a>
            </li>

            <li class="nav-item">
                <span class="nav-icon">👤</span>
                <a href="personal.html" class="nav-link" id="personal-link">Personal Center</a>
            </li>

            <li class="nav-item">
                <span class="nav-icon">🚪</span>
                <a href="#" class="nav-link" id="logout-link">Logout</a>
            </li>

        </ul>
    </nav>

<!-- main -->
<main class="main-content">
    <div class="content-header">
        <h1>Personal Center</h1>
        <p style="color:var(--text-secondary); margin-top:8px;">
            Update your personal information below
        </p>
    </div>

    <div class="personal-container">
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="username" value="current_username">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" value="current_password">
        </div>
        <div class="input-group">
            <label>Phone</label>
            <input type="text" id="phone" value="current_phone">
        </div>
        <div class="input-group">
            <label>Email</label>
            <input type="email" id="email" value="current_email">
        </div>
        <button class="save-btn" onclick="saveInfo()">Save</button>
    </div>
</main>

</div>

<script>
// Load user data
async function loadUserData() {
    const user = JSON.parse(localStorage.getItem('hm_user')||'null');
    if (!user || !user.user_id) {
        alert('Please login first');
        window.location.href = '../Staff/Login_Register.html';
        return;
    }
    
    // Get latest user info from localStorage or API
    try {
        const response = await fetch('http://localhost/api/user_profile_get.php?user_id=' + encodeURIComponent(user.user_id));
        const data = await response.json();
        
        if (data && data.ok && data.user) {
            // Update display
            document.getElementById('username').value = data.user.user_name || '';
            document.getElementById('phone').value = data.user.user_phone || '';
            document.getElementById('email').value = data.user.user_email || '';
            
            // Update localStorage
            localStorage.setItem('hm_user', JSON.stringify(data.user));
        } else {
            // Use localStorage data
            document.getElementById('username').value = user.user_name || '';
            document.getElementById('phone').value = user.user_phone || '';
            document.getElementById('email').value = user.user_email || '';
        }
    } catch(e) {
        // API failed, use localStorage
        document.getElementById('username').value = user.user_name || '';
        document.getElementById('phone').value = user.user_phone || '';
        document.getElementById('email').value = user.user_email || '';
    }
    
    // Clear password field
    document.getElementById('password').value = '';
}

async function saveInfo() {
    const user = JSON.parse(localStorage.getItem('hm_user')||'null');
    if (!user || !user.user_id) {
        alert('Please login first');
        return;
    }
    
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const email = document.getElementById("email").value.trim();

    if (!username) { 
        alert("Username cannot be empty"); 
        return; 
    }
    
    // If modifying password, validate password length
    if (password && (password.length < 6 || password.length > 20)) { 
        alert("Password must be 6-20 characters"); 
        return; 
    }
    
    if (phone && !/^\d{10,15}$/.test(phone)) { 
        alert("Phone must be 10-15 digits"); 
        return; 
    }
    
    if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { 
        alert("Invalid email address"); 
        return; 
    }

    try {
        const payload = {
            user_id: user.user_id,
            user_phone: phone,
            user_email: email
        };
        
        if (password) {
            payload.new_password = password;
        }
        
        const response = await fetch('http://localhost/api/user_profile_update.php', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        
        const data = await response.json();
        
        if (data && data.ok) {
            alert("Personal information saved successfully!");
            
            // Update localStorage
            user.user_phone = phone;
            user.user_email = email;
            localStorage.setItem('hm_user', JSON.stringify(user));
            
            // Clear password field
            document.getElementById('password').value = '';
            
            // Reload data
            loadUserData();
        } else {
            alert("Failed to save: " + (data.error || 'Server error'));
        }
    } catch(e) {
        alert("Failed to save: Network error");
    }
}

function updateNav() {
    const loggedIn = localStorage.getItem("loggedIn") === "true";
    const loginLink = document.getElementById("login-link");
    if (loginLink) loginLink.style.display = loggedIn ? "none" : "block";
}

const logoutLink = document.getElementById("logout-link");
if (logoutLink) {
    logoutLink.addEventListener("click", function(e) {
        e.preventDefault(); 
        localStorage.removeItem('hm_user');
        localStorage.setItem("loggedIn", "false");
        alert("Logout successful!");
        window.location.href = '../Staff/Login_Register.html';
    });
}

document.querySelectorAll('.nav-item').forEach(item => {
    const link = item.querySelector('a');
    if (link && link.href === window.location.href) {
        item.classList.add('active');
    } else {
        item.classList.remove('active');
    }
});

// Initialize on page load
if (localStorage.getItem("loggedIn") === null) {
    localStorage.setItem("loggedIn", "true");
}
updateNav();
loadUserData();

</script>

</body>
</html>
