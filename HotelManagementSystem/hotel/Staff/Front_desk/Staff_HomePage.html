<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Hotel - Hotel System</title>
    <link rel="stylesheet" href="../../global.css">
    <link rel="stylesheet" href="../global_modal.css">
    <link rel="stylesheet" href="Staff.css">
  <title>Hotel Management System - Choose Hotel</title>
</head>
<body>
  <div class="app-container"> 
    <!-- Sidebar -->
    <nav class="sidebar">
      <div class="sidebar-header">
        🏨 
        Hotel Management System
      </div>
      <ul class="nav-menu">
        <li class="nav-item active">
          <span class="nav-icon">🏠</span>
          <a href="./Order_room.html" class="nav-link">Select Room Type</a>
        </li>
        <li class="nav-item">
          <span class="nav-icon">📝</span>
          <a href="./Check_in_out.html" class="nav-link">Check-in/Check-out</a>
        </li>
        <li class="nav-item">
          <span class="nav-icon">💳</span>
          <a href="./Cleaning_task.html" class="nav-link">Services</a>
        </li>
        <li class="nav-item" id="kpiMenuItem" style="display:none;">
          <span class="nav-icon">📊</span>
          <a href="../Manager/KPI.html" class="nav-link">Performance</a>
        </li>
        <li class="nav-item">
          <span class="nav-icon">⚙️</span>
          <a href="./Front_desk_information.html" class="nav-link">Personal Account</a>
        </li>
        <li class="nav-item">
          <span class="nav-icon">⚙️</span>
          <a href="../Login_Register.html" class="nav-link">Logout</a>
        </li>
      </ul>
    </nav>

        <main class="main-content">
            <div class="header-box" style="background-color: #2c5aa0; color: white;">
                <h1 style="color:white;">Time Test: Insertion / Deletion / Search</h1>
                <p class="subtitle" style="color: white;"><a href="../../performance_test.html" class="nav-link">Click here!</a></p>
            </div>
            <div class="header-box">
                <h1>Choose Hotel</h1>
                <p class="subtitle">Select a hotel for operations</p>
            </div>

            <div class="hotels-box" id="hotelsContainer">
                <p style="text-align:center;padding:40px;color:var(--text-secondary);">Loading hotels...</p>
            </div>
        </main>
    </div>

    <!-- warning -->
    <div class="alert-overlay" id="alertOverlay"></div>
    <div class="alert-box" id="alertBox">
        <p id="alertText">Hotel is fully booked!</p>
        <button class="alert-btn" onclick="closeAlert()">OK</button>
    </div>

    <script>
        // RBAC guard: only reception or manager
        (function(){
            try {
                const user = JSON.parse(localStorage.getItem('hm_user')||'null');
                const role = user && user.role_id;
                if (!role || (role !== 'reception' && role !== 'manager')) {
                    alert('No permission to access front desk pages');
                    window.location.href = '../Login_Register.html';
                    return;
                }
                // If manager, show KPI menu item
                if (role === 'manager') {
                    const kpiMenuItem = document.getElementById('kpiMenuItem');
                    if (kpiMenuItem) kpiMenuItem.style.display = 'block';
                }
            } catch(e) {
                window.location.href = '../Login_Register.html';
                return;
            }
        })();
        
        async function fetchJSON(url, options){
            try {
                const r = await fetch(url, options);
                const text = await r.text();
                try { return JSON.parse(text); } catch(e) { return { ok:false, error:'bad_json' }; }
            } catch(e) {
                return { ok:false, error:'network_error' };
            }
        }
        
        async function loadHotels() {
            const container = document.getElementById('hotelsContainer');
            container.innerHTML = '<p style="text-align:center;padding:40px;">Loading hotels...</p>';
            
            const hotelsResp = await fetchJSON('http://localhost/api/hotels_get.php');
            const roomsResp = await fetchJSON('http://localhost/api/rooms_get.php');
            const ordersResp = await fetchJSON('http://localhost/api/orders_get.php');
            
            const hotels = (hotelsResp && hotelsResp.ok) ? hotelsResp.data : [];
            const rooms = (roomsResp && roomsResp.ok) ? roomsResp.data : [];
            const orders = (ordersResp && ordersResp.ok) ? ordersResp.data : [];
            
            container.innerHTML = '';
            
            if (hotels.length === 0) {
                container.innerHTML = '<p style="text-align:center;padding:40px;color:var(--text-secondary);">No hotels found</p>';
                return;
            }
            
            hotels.forEach(hotel => {
                // Since system has only one hotel, all rooms belong to this hotel
                const totalRooms = rooms.length;
                const occupiedRooms = rooms.filter(r => r.room_status === 'unavailable').length;
                
                const today = new Date().toISOString().split('T')[0];
                const todayOrders = orders.filter(o => 
                    o.check_in === today && o.order_status !== 'Cancelled'
                ).length;
                
                const isFullyBooked = occupiedRooms >= totalRooms * 0.95;
                
                const card = document.createElement('div');
                card.className = 'hotel-card';
                card.innerHTML = `
                    <div class="hotel-img">🏢</div>
                    <div class="hotel-details">
                        <div class="hotel-name">${hotel.hotel_name || 'Hotel'}</div>
                        <div class="hotel-location">📍 ${hotel.address || 'Address not available'}</div>
                        <div class="hotel-desc">${hotel.country || 'Country not specified'}. ☎️ ${hotel.hotel_phone || 'N/A'}</div>
                        <div class="stats-row">
                            <div class="stat-item">
                                <div class="stat-num">${totalRooms}</div>
                                <div class="stat-text">Total Rooms</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-num">${occupiedRooms}</div>
                                <div class="stat-text">Occupied</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-num">${todayOrders}</div>
                                <div class="stat-text">Booked Today</div>
                            </div>
                        </div>
                        <a href="./Order_room.html" class="book-btn ${isFullyBooked ? 'disabled' : ''}" 
                           ${isFullyBooked ? `onclick="return showFullAlert('${hotel.hotel_name}')"` : ''}>
                            ${isFullyBooked ? 'Fully Booked' : 'Select Hotel'}
                        </a>
                    </div>
                `;
                container.appendChild(card);
            });
        }
        
        function showFullAlert(hotelName) {
            document.getElementById('alertText').textContent = hotelName + ' is fully booked';
            document.getElementById('alertOverlay').style.display = 'block';
            document.getElementById('alertBox').style.display = 'block';
            return false;
        }
        
        function closeAlert() {
            document.getElementById('alertOverlay').style.display = 'none';
            document.getElementById('alertBox').style.display = 'none';
        }
        
        window.onload = function() {
            loadHotels();
        };
    </script>
</body>
</html>
