<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance - Hotel System</title>
    <link rel="stylesheet" href="../../global.css">
    <link rel="stylesheet" href="../global_modal.css">
    <link rel="stylesheet" href="KPI.css">
</head>

<body>
    <div class="app-container">
        <!-- sidebar -->
        <nav class="sidebar">
            <div class="sidebar-header">🏨 Hotel Management System</div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <span class="nav-icon">🏠</span>
                    <a href="../Front_desk/Order_room.html" class="nav-link">Room Selection</a>
                </li>
                <li class="nav-item">
                    <span class="nav-icon">📝</span>
                    <a href="../Front_desk/Check_in_out.html" class="nav-link">Check-in/Check-out</a>
                </li>
                <li class="nav-item">
                    <span class="nav-icon">💳</span>
                    <a href="../Front_desk/Cleaning_task.html" class="nav-link">Services</a>
                </li>
                <li class="nav-item active">
                    <span class="nav-icon">📊</span>
                    <a href="./KPI.html" class="nav-link">Personal Performance</a>
                </li>
                <li class="nav-item">
                    <span class="nav-icon">⚙️</span>
                    <a href="./Manager_information.html" class="nav-link">Personal Account</a>
                </li>
                <li class="nav-item">
                    <span class="nav-icon">⚙️</span>
                    <a href="../Login_Register.html" class="nav-link">Logout</a>
                </li>
            </ul>
        
        </nav>

        <main class="main-content">
            <div class="header-box" style="background-color: #2c5aa0; color: white;">
                <h1 style="color:white;">Time Test: Insertion / Deletion / Search</h1>
                <p class="subtitle" style="color: white;"><a href="../../performance_test.html" class="nav-link">Click here!</a></p>
            </div>
            <div class="header-box">
                <h1>Employee Performance</h1>
            </div>

            <!-- count -->
            <div class="stats-box" id="kpiStats"></div>

            <!-- filter -->
            <div class="filter-box">
                <div class="filter-item">
                    <label>Position</label>
                    <select id="positionFilter" onchange="filterTable()">
                        <option value="all">All</option>
                        <option value="reception">Reception</option>
                        <option value="cleaner">Cleaner</option>
                        <option value="manager">Manager</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label>Search</label>
                    <input type="text" id="searchBox" placeholder="Name or phone" oninput="searchTable()">
                </div>
                <div class="filter-item">
                    <label>Status</label>
                    <select id="statusFilter" onchange="filterTable()">
                        <option value="all">All</option>
                        <option value="qualified">Qualified</option>
                        <option value="unqualified">Unqualified</option>
                        <option value="excellent">Excellent</option>
                    </select>
                </div>
            </div>

            <!-- table-->
            <div class="table-box">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Phone</th>
                            <th>Position</th>
                            <th>Tasks</th>
                            <th>Rate</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        // RBAC guard: only manager
        (function(){
            try {
                const user = JSON.parse(localStorage.getItem('hm_user')||'null');
                const role = user && user.role_id;
                if (role !== 'manager') {
                    alert('No permission to access manager pages');
                    window.location.href = '../Login_Register.html';
                    return;
                }
            } catch(e) {
                window.location.href = '../Login_Register.html';
                return;
            }
        })();
        async function fetchJSON(url, options){ 
            try { 
                const r = await fetch(url, options); 
                const text = await r.text();
                try { return JSON.parse(text); } catch(e) { console.error('bad_json', url, text); return { ok:false, error:'bad_json' }; }
            } catch(e) { 
                console.error('network_error', url, e);
                return { ok:false, error:'network_error' }; 
            } 
        }
        
        async function renderKPI() {
            const api = await fetchJSON('http://localhost/api/kpi_get.php');
            
            if (!api || !api.ok) {
                console.error('Failed to load KPI data');
                return;
            }
            
            const employees = api.data || [];
            const summary = api.summary || {};
            
            // Render table
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            employees.forEach(emp => {
                const positionMap = {
                    'reception': 'Reception',
                    'cleaner': 'Cleaner',
                    'manager': 'Manager',
                    'staff': 'Reception'
                };
                const positionText = positionMap[emp.position] || emp.position;
                const positionClass = emp.position === 'manager' ? 'tag-manager' : (emp.position === 'reception' || emp.position === 'staff' ? 'tag-reception' : 'tag-cleaner');
                
                const statusMap = {
                    'excellent': '★ Excellent',
                    'qualified': '✓ Qualified',
                    'unqualified': '✗ Unqualified'
                };
                const statusClass = emp.status === 'excellent' ? 'status-excellent' : (emp.status === 'qualified' ? 'status-qualified' : 'status-unqualified');
                
                const tr = document.createElement('tr');
                tr.dataset.position = emp.position;
                tr.dataset.status = emp.status;
                tr.innerHTML = `
                    <td>${emp.user_name}</td>
                    <td>${emp.user_phone || ''}</td>
                    <td><span class="position-tag ${positionClass}">${positionText}</span></td>
                    <td>${emp.total}</td>
                    <td>${emp.rate}%</td>
                    <td><span class="status-badge ${statusClass}">${statusMap[emp.status]}</span></td>
                    <td><button class="detail-btn" onclick="viewDetail('${emp.user_name}')">Details</button></td>`;
                tbody.appendChild(tr);
            });
            
            // Render statistics
            const stats = document.getElementById('kpiStats');
            const avgTasks = employees.length > 0 ? Math.round(employees.reduce((sum, e) => sum + e.total, 0) / employees.length) : 0;
            const qualifiedRate = employees.length > 0 ? Math.round((summary.excellent_count + summary.qualified_count) / employees.length * 100) : 0;
            
            stats.innerHTML = `
                <div class="stat-box"><div class="stat-number">${summary.total_employees || 0}</div><div class="stat-label">Total Employees</div></div>
                <div class="stat-box"><div class="stat-number">${avgTasks}</div><div class="stat-label">Avg Tasks</div></div>
                <div class="stat-box"><div class="stat-number">${qualifiedRate}%</div><div class="stat-label">Qualification Rate</div></div>
                <div class="stat-box"><div class="stat-number">${summary.excellent_count || 0}</div><div class="stat-label">Excellent Employees</div></div>`;
        }

        function filterTable() {
            const position = document.getElementById('positionFilter').value;
            const status = document.getElementById('statusFilter').value;
            const rows = document.querySelectorAll('#tableBody tr');
            rows.forEach(row => {
                const posMatch = position === 'all' || row.dataset.position === position;
                const statusMatch = status === 'all' || row.dataset.status === status;
                row.style.display = (posMatch && statusMatch) ? '' : 'none';
            });
        }

        function searchTable() {
            const term = document.getElementById('searchBox').value.toLowerCase();
            const rows = document.querySelectorAll('#tableBody tr');
            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(term) ? '' : 'none';
            });
        }

        function viewDetail(name) {
            alert('View details for: ' + name);
        }

        window.onload = function() {
            renderKPI();
        };
    </script>
</body>
</html>
