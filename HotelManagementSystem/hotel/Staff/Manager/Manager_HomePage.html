<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Hotel - Hotel System</title>
    <link rel="stylesheet" href="../../global.css">
    <link rel="stylesheet" href="../Front_desk/Staff.css">
</head>

<body>
    <div class="app-container">
        <!-- sidebar -->
        <nav class="sidebar">
            <div class="sidebar-header">🏨 Hotel Management System</div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <span class="nav-icon">🏠</span>
                    <a href="../Front_desk/Order_room.html" class="nav-link">Room Selection</a>
                </li>
                <li class="nav-item">
                    <span class="nav-icon">📝</span>
                    <a href="../Front_desk/Check_in_out.html" class="nav-link">Check-in/Check-out</a>
                </li>
                <li class="nav-item">
                    <span class="nav-icon">💳</span>
                    <a href="../Front_desk/Cleaning_task.html" class="nav-link">Services</a>
                </li>
                <li class="nav-item">
                    <span class="nav-icon">📊</span>
                    <a href="./KPI.html" class="nav-link">Personal Performance</a>
                </li>
                <li class="nav-item active">
                    <span class="nav-icon">⚙️</span>
                    <a href="./Manager_information.html" class="nav-link">Personal Account</a>
                </li>
                <li class="nav-item">
                    <span class="nav-icon">⚙️</span>
                    <a href="../Login_Register.html" class="nav-link">Logout</a>
                </li>
            </ul>
        </nav>

        <main class="main-content">
            <div class="header-box" style="background-color: #2c5aa0; color: white;">
                <h1 style="color:white;">Time Test: Insertion / Deletion / Search</h1>
                <p class="subtitle" style="color: white;"><a href="../../performance_test.html" class="nav-link">Click here!</a></p>
            </div>
            <div class="header-box">
                <h1>Choose Hotel</h1>
                <p class="subtitle">Select a hotel for operations</p>
            </div>

            <!-- Hotels will be loaded dynamically -->
            <div class="hotels-box" id="hotelsContainer">
                <p>Loading hotels...</p>
            </div>
        </main>
    </div>

    <!-- warning -->
    <div class="alert-overlay" id="alertOverlay"></div>
    <div class="alert-box" id="alertBox">
        <p id="alertText">Hotel is fully booked!</p>
        <button class="alert-btn" onclick="closeAlert()">OK</button>
    </div>

    <script>
        // RBAC guard: only manager
        (function(){
            try {
                const user = JSON.parse(localStorage.getItem('hm_user')||'null');
                const role = user && user.role_id;
                if (role !== 'manager') {
                    alert('No permission to access manager pages');
                    window.location.href = '../Login_Register.html';
                    return;
                }
            } catch(e) {
                window.location.href = '../Login_Register.html';
                return;
            }
        })();
        
        // overflow
        function showFullAlert(hotelName) {
            document.getElementById('alertText').textContent = hotelName + ' is fully booked';
            document.getElementById('alertOverlay').style.display = 'block';
            document.getElementById('alertBox').style.display = 'block';
            return false;
        }
        
        function closeAlert() {
            document.getElementById('alertOverlay').style.display = 'none';
            document.getElementById('alertBox').style.display = 'none';
        }
        
        // Load hotels and their statistics
        async function loadHotels() {
            const container = document.getElementById('hotelsContainer');
            
            try {
                // Fetch hotels
                const hotelsRes = await fetch('../../api/hotels_get.php');
                const hotelsData = await hotelsRes.json();
                
                if (!hotelsData.ok || !hotelsData.data || hotelsData.data.length === 0) {
                    container.innerHTML = '<p>No hotels found</p>';
                    return;
                }
                
                container.innerHTML = '';
                
                // Load each hotel with its statistics
                // Note: room_stats_get.php returns stats for all rooms (single hotel system)
                const statsRes = await fetch('../../api/room_stats_get.php');
                const statsData = await statsRes.json();
                
                for (const hotel of hotelsData.data) {
                    
                    const stats = statsData.ok ? statsData.data : {
                        total_rooms: 0,
                        occupied_rooms: 0,
                        available_rooms: 0,
                        today_bookings: 0
                    };
                    
                    const isFullyBooked = stats.available_rooms === 0;
                    const buttonClass = isFullyBooked ? 'book-btn disabled' : 'book-btn';
                    const buttonText = isFullyBooked ? 'Fully Booked' : 'Enter Hotel';
                    const buttonAction = isFullyBooked 
                        ? `onclick="return showFullAlert('${hotel.hotel_name}')"` 
                        : '';
                    
                    const hotelCard = `
                        <div class="hotel-card">
                            <div class="hotel-img">🏢</div>
                            <div class="hotel-details">
                                <div class="hotel-name">${hotel.hotel_name}</div>
                                <div class="hotel-location">📍 ${hotel.address || 'Address not available'}</div>
                                <div class="hotel-desc">${hotel.description || 'No description available'}</div>
                                <div class="stats-row">
                                    <div class="stat-item">
                                        <div class="stat-num">${stats.total_rooms}</div>
                                        <div class="stat-text">Total Rooms</div>
                                    </div>
                                    <div class="stat-item">
                                        <div class="stat-num">${stats.occupied_rooms}</div>
                                        <div class="stat-text">Occupied</div>
                                    </div>
                                    <div class="stat-item">
                                        <div class="stat-num">${stats.today_bookings}</div>
                                        <div class="stat-text">Booked Today</div>
                                    </div>
                                </div>
                                <a href="../Front_desk/Order_room.html" class="${buttonClass}" ${buttonAction}>
                                    ${buttonText}
                                </a>
                            </div>
                        </div>
                    `;
                    
                    container.innerHTML += hotelCard;
                }
            } catch (err) {
                console.error('Error loading hotels:', err);
                container.innerHTML = '<p>Error loading hotels. Please try again.</p>';
            }
        }
        
        // Load hotels on page load
        window.onload = function() {
            console.log('Manager page loaded - loading hotels dynamically');
            loadHotels();
        };
    </script>
</body>
</html>
